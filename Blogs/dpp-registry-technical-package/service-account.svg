<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="sa-t sa-d">
  <title id="sa-t">Direction 1: your system logs in to the EU DPP Registry API with a service account</title>
  <desc id="sa-d">Set up once: an administrator of your verified organisation creates a service account in the Registry and uploads the public key. Step 1: your system, which holds the private key, signs a short message and sends it to the Commission login service. Step 2: the login service checks the message against your public key and returns an access pass valid for 15 minutes. Step 3: your system calls the Registry API with that pass, for example to register passports. A service account is only needed when you register through the API; in the web portal you log in yourself.</desc>
  <defs>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AAAB4"/>
    </marker>
  </defs>

  <rect width="680" height="490" rx="18" fill="#FFFFFF" stroke="#E2E8ED"/>

  <text x="340" y="40" text-anchor="middle" fill="#006d38" font-size="12" font-weight="700" letter-spacing="1.4">DIRECTION 1 · YOUR SYSTEM CALLS THE REGISTRY API</text>
  <text x="340" y="68" text-anchor="middle" fill="#1A2B36" font-size="20" font-weight="700">Logging in to the Registry API with a service account</text>

  <!-- A: your system -->
  <rect x="40" y="96" width="220" height="250" rx="12" fill="#FFFFFF" stroke="#ECEFF1"/>
  <rect x="40" y="96" width="6" height="250" rx="3" fill="#008545"/>
  <text x="62" y="124" fill="#006d38" font-size="12" font-weight="700" letter-spacing="1.1">YOUR SYSTEM</text>
  <!-- key icon -->
  <g stroke="#243644" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="74" cy="154" r="10"/>
    <path d="M84 154 H112 M104 154 V163 M111 154 V160"/>
  </g>
  <text x="62" y="200" fill="#1A2B36" font-size="15" font-weight="700">Holds the private key</text>
  <text x="62" y="222" fill="#5A6B73" font-size="13">It never leaves your</text>
  <text x="62" y="240" fill="#5A6B73" font-size="13">own systems.</text>
  <line x1="62" y1="264" x2="238" y2="264" stroke="#ECEFF1"/>
  <text x="62" y="292" fill="#6b7280" font-size="12.5">Up to 5 service accounts</text>
  <text x="62" y="310" fill="#6b7280" font-size="12.5">per organisation</text>

  <!-- B: login service -->
  <rect x="400" y="96" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#ECEFF1"/>
  <rect x="400" y="96" width="6" height="110" rx="3" fill="#009BBB"/>
  <text x="422" y="124" fill="#00728b" font-size="12" font-weight="700" letter-spacing="1.1">COMMISSION LOGIN SERVICE</text>
  <text x="422" y="152" fill="#1A2B36" font-size="15" font-weight="700">Checks the message</text>
  <text x="422" y="174" fill="#5A6B73" font-size="13">against your public key</text>
  <text x="422" y="192" fill="#5A6B73" font-size="13">and issues the pass</text>

  <!-- C: registry -->
  <rect x="400" y="236" width="240" height="110" rx="12" fill="#0F2A22"/>
  <text x="422" y="264" fill="#AFF9D7" font-size="12" font-weight="700" letter-spacing="1.1">EU DPP REGISTRY API</text>
  <text x="422" y="292" fill="#FFFFFF" font-size="15" font-weight="700">Accepts the API call</text>
  <text x="422" y="314" fill="#9DC9B8" font-size="13">if the pass is valid, e.g.</text>
  <text x="422" y="332" fill="#9DC9B8" font-size="13">a batch of registrations</text>

  <!-- Step arrows -->
  <g font-size="12" fill="#5A6B73" text-anchor="middle">
    <line x1="268" y1="134" x2="392" y2="134" stroke="#9AAAB4" stroke-width="2" marker-end="url(#sa-arrow)"/>
    <text x="330" y="120">signed message</text>
    <line x1="392" y1="176" x2="268" y2="176" stroke="#9AAAB4" stroke-width="2" marker-end="url(#sa-arrow)"/>
    <text x="330" y="196">access pass, 15 min</text>
    <line x1="268" y1="291" x2="392" y2="291" stroke="#9AAAB4" stroke-width="2" marker-end="url(#sa-arrow)"/>
    <text x="330" y="277">API call + pass</text>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="288" cy="134" r="10" fill="#1B2833"/><text x="288" y="138" fill="#FFFFFF">1</text>
    <circle cx="372" cy="176" r="10" fill="#1B2833"/><text x="372" y="180" fill="#FFFFFF">2</text>
    <circle cx="288" cy="291" r="10" fill="#1B2833"/><text x="288" y="295" fill="#FFFFFF">3</text>
  </g>

  <!-- Setup strip -->
  <rect x="40" y="366" width="600" height="100" rx="12" fill="#E1F2F6" stroke="#009BBB" stroke-dasharray="6 4"/>
  <text x="60" y="392" fill="#00728b" font-size="12" font-weight="700" letter-spacing="1.1">SET UP ONCE</text>
  <text x="60" y="414" fill="#1B2833" font-size="13.5">An administrator of your verified organisation creates the</text>
  <text x="60" y="432" fill="#1B2833" font-size="13.5">service account in the Registry and uploads the public key.</text>
  <text x="60" y="452" fill="#5A6B73" font-size="13">Only needed for the API. In the web portal you log in yourself.</text>
</svg>
