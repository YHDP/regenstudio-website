<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="pp-t pp-d">
  <title id="pp-t">Direction 2: what your passport server returns when the Registry asks</title>
  <desc id="pp-d">A request without a pass, from any visitor or as the Registry's first call, gets only the public part of the passport. A request from the Registry with a Commission pass that checks out gets the public and the protected part. A request with a pass that is wrong, expired or issued for another caller is refused with error 401 or 403 and never gets the public part instead; the Registry already has the public part from its first call. Only the Registry can get the protected part today, and a website of fixed files cannot check the pass.</desc>
  <defs>
    <marker id="pp-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AAAB4"/>
    </marker>
    <clipPath id="pp-c1"><rect x="390" y="96" width="250" height="96" rx="10"/></clipPath>
    <clipPath id="pp-c2"><rect x="390" y="210" width="250" height="96" rx="10"/></clipPath>
  </defs>

  <rect width="680" height="530" rx="18" fill="#FFFFFF" stroke="#E2E8ED"/>

  <text x="340" y="40" text-anchor="middle" fill="#006d38" font-size="12" font-weight="700" letter-spacing="1.4">DIRECTION 2 · THE REGISTRY CALLS YOUR SERVER</text>
  <text x="340" y="68" text-anchor="middle" fill="#1A2B36" font-size="20" font-weight="700">What your server returns, and to whom</text>

  <!-- Row 1: no pass -->
  <rect x="40" y="96" width="280" height="96" rx="12" fill="#F5F7F9" stroke="#E2E8ED"/>
  <text x="60" y="124" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="1.1">ANY VISITOR, OR THE REGISTRY</text>
  <text x="60" y="150" fill="#1A2B36" font-size="15" font-weight="700">Asks without a pass</text>
  <text x="60" y="172" fill="#5A6B73" font-size="13">also the Registry's first call</text>
  <line x1="328" y1="144" x2="380" y2="144" stroke="#9AAAB4" stroke-width="2" marker-end="url(#pp-arrow)"/>
  <g clip-path="url(#pp-c1)">
    <rect x="390" y="96" width="250" height="48" fill="#E6F2EC"/>
    <rect x="390" y="144" width="250" height="48" fill="#F5F7F9"/>
  </g>
  <rect x="390" y="96" width="250" height="96" rx="10" fill="none" stroke="#9ACBB4"/>
  <line x1="390" y1="144" x2="640" y2="144" stroke="#C9D2D5" stroke-dasharray="5 4"/>
  <text x="410" y="126" fill="#006838" font-size="14" font-weight="700">Public part</text>
  <text x="410" y="174" fill="#6b7280" font-size="13">Protected part: not sent</text>

  <!-- Row 2: valid pass -->
  <rect x="40" y="210" width="280" height="96" rx="12" fill="#F5F7F9" stroke="#E2E8ED"/>
  <rect x="40" y="210" width="6" height="96" rx="3" fill="#008545"/>
  <text x="60" y="238" fill="#006d38" font-size="12" font-weight="700" letter-spacing="1.1">THE REGISTRY, SECOND CALL</text>
  <text x="60" y="264" fill="#1A2B36" font-size="15" font-weight="700">Asks with a Commission pass</text>
  <text x="60" y="286" fill="#5A6B73" font-size="13">and the pass checks out</text>
  <line x1="328" y1="258" x2="380" y2="258" stroke="#9AAAB4" stroke-width="2" marker-end="url(#pp-arrow)"/>
  <g clip-path="url(#pp-c2)">
    <rect x="390" y="210" width="250" height="48" fill="#E6F2EC"/>
    <rect x="390" y="258" width="250" height="48" fill="#243644"/>
  </g>
  <rect x="390" y="210" width="250" height="96" rx="10" fill="none" stroke="#243644"/>
  <text x="410" y="240" fill="#006838" font-size="14" font-weight="700">Public part</text>
  <!-- lock -->
  <path d="M413 280 V276 A5 5 0 0 1 423 276 V280" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <rect x="410" y="280" width="16" height="12" rx="2" fill="#FFFFFF"/>
  <text x="436" y="290" fill="#FFFFFF" font-size="14" font-weight="700">Protected part</text>

  <!-- Row 3: failed pass -->
  <rect x="40" y="324" width="280" height="124" rx="12" fill="#F5F7F9" stroke="#E2E8ED"/>
  <rect x="40" y="324" width="6" height="124" rx="3" fill="#E71846"/>
  <text x="60" y="352" fill="#D51641" font-size="12" font-weight="700" letter-spacing="1.1">A PASS THAT FAILS THE CHECK</text>
  <text x="60" y="378" fill="#1A2B36" font-size="15" font-weight="700">Wrong or expired pass</text>
  <text x="60" y="400" fill="#5A6B73" font-size="13">or one issued for another caller</text>
  <line x1="328" y1="386" x2="380" y2="386" stroke="#9AAAB4" stroke-width="2" marker-end="url(#pp-arrow)"/>
  <rect x="390" y="324" width="250" height="124" rx="10" fill="#FDF0F3" stroke="#F1C4CF"/>
  <text x="410" y="352" fill="#D51641" font-size="12" font-weight="700" letter-spacing="1.1">REFUSED · ERROR 401 OR 403</text>
  <text x="410" y="378" fill="#1B2833" font-size="14" font-weight="700">Never the public part</text>
  <text x="410" y="396" fill="#1B2833" font-size="14" font-weight="700">instead</text>
  <text x="410" y="420" fill="#5A6B73" font-size="13">The Registry already has it</text>
  <text x="410" y="437" fill="#5A6B73" font-size="13">from its first call.</text>

  <!-- Note -->
  <text x="40" y="486" fill="#5A6B73" font-size="13">Only the Registry can get the protected part today. A website of fixed files cannot</text>
  <text x="40" y="506" fill="#5A6B73" font-size="13">check the pass: it needs a small program on the server, or a passport provider.</text>
</svg>
