<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 930" width="400" height="930" role="img" aria-labelledby="t d">
  <title id="t">Quando um portador de dados é de fato obrigatório no artigo 12.º do PPWR</title>
  <desc id="d">Quatro casos. Embalagem reutilizável a partir de 12 de fevereiro de 2029, ou 30 meses após o ato do artigo 12.º, n.º 6, e inaplicável a sistemas abertos sem operador. Embalagem com substâncias preocupantes, operável quando existir a metodologia devida em 1 de janeiro de 2030, sem limiar no texto. Embalagem onde nenhum rótulo cabe, que já se aplica pelo artigo 12.º, n.º 5. Identificação de responsabilidade alargada do produtor até 12 de fevereiro de 2027, facultativa, mas só por marcação digital se for feita.</desc>
  <rect width="400" height="930" fill="#ffffff"/>
  <text x="16" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#1B2833">Quando um portador é de fato obrigatório</text>
  <text x="16" y="56" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#5A6B73">O artigo 12.º obriga um portador de dados em quatro casos.</text>
  <text x="16" y="73" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#5A6B73">Nenhum deles tem data incondicional.</text>
  <line x1="16" y1="86" x2="384" y2="86" stroke="#008545" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="8" y="100" width="384" height="188" rx="12" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="34" cy="130" r="14" fill="#1B2833"/><text x="34" y="135" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="56" y="135" font-size="17" font-weight="700" fill="#1B2833">Embalagem reutilizável</text>
    <text x="384" y="135" font-size="11" fill="#5A6B73" text-anchor="end">Art 12(2)–(3)</text>
    <rect x="56" y="150" width="96" height="20" rx="5" fill="#FFF3E0" stroke="#E8C88F"/>
    <text x="104" y="164" font-size="10.5" font-weight="700" fill="#935D0D" text-anchor="middle">CONDICIONAL</text>
    <text x="160" y="165" font-size="13" fill="#1a1a1a">12 fev 2029, ou +30 meses</text>
    <text x="56" y="196" font-size="14" fill="#333">Leva o sistema de reutilização e os pontos</text>
    <text x="56" y="216" font-size="14" fill="#333">de coleta, e deve rastrear viagens e rotações.</text>
    <text x="56" y="236" font-size="14" fill="#333">Não se aplica a sistemas abertos sem</text>
    <text x="56" y="256" font-size="14" fill="#333">operador de sistema.</text>

    <rect x="8" y="300" width="384" height="188" rx="12" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="34" cy="330" r="14" fill="#1B2833"/><text x="34" y="335" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="56" y="335" font-size="17" font-weight="700" fill="#1B2833">Substâncias preocupantes</text>
    <text x="384" y="335" font-size="11" fill="#5A6B73" text-anchor="end">Art 12(1)</text>
    <rect x="56" y="350" width="96" height="20" rx="5" fill="#FFF3E0" stroke="#E8C88F"/>
    <text x="104" y="364" font-size="10.5" font-weight="700" fill="#935D0D" text-anchor="middle">CONDICIONAL</text>
    <text x="160" y="365" font-size="13" fill="#1a1a1a">metodologia devida em 1 jan 2030</text>
    <text x="56" y="396" font-size="14" fill="#333">Marcadas por tecnologias de marcação digital</text>
    <text x="56" y="416" font-size="14" fill="#333">padronizadas e abertas. Sem limiar no texto:</text>
    <text x="56" y="436" font-size="14" fill="#333">vale sempre que estiverem presentes, na</text>
    <text x="56" y="456" font-size="14" fill="#333">tinta, no adesivo, na camada de barreira.</text>

    <rect x="8" y="500" width="384" height="188" rx="12" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="34" cy="530" r="14" fill="#1B2833"/><text x="34" y="535" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="56" y="535" font-size="17" font-weight="700" fill="#1B2833">Nenhum rótulo cabe</text>
    <text x="384" y="535" font-size="11" fill="#5A6B73" text-anchor="end">Art 12(5)</text>
    <rect x="56" y="550" width="96" height="20" rx="5" fill="#E6F2EC" stroke="#9ACBB4"/>
    <text x="104" y="564" font-size="10.5" font-weight="700" fill="#006838" text-anchor="middle">JÁ SE APLICA</text>
    <text x="160" y="565" font-size="13" fill="#1a1a1a">o digital substitui o físico</text>
    <text x="56" y="596" font-size="14" fill="#333">Onde não cabe rótulo na embalagem nem na</text>
    <text x="56" y="616" font-size="14" fill="#333">embalagem agrupada, ou onde o acesso de</text>
    <text x="56" y="636" font-size="14" fill="#333">grupos vulneráveis, em especial pessoas com</text>
    <text x="56" y="656" font-size="14" fill="#333">deficiência visual, exige isso.</text>

    <rect x="8" y="700" width="384" height="188" rx="12" fill="#ffffff" stroke="#e0e0e0"/>
    <circle cx="34" cy="730" r="14" fill="#1B2833"/><text x="34" y="735" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="56" y="735" font-size="17" font-weight="700" fill="#1B2833">Identificação de REP</text>
    <text x="384" y="735" font-size="11" fill="#5A6B73" text-anchor="end">Art 12(9)</text>
    <rect x="56" y="750" width="96" height="20" rx="5" fill="#E6F2EC" stroke="#9ACBB4"/>
    <text x="104" y="764" font-size="10.5" font-weight="700" fill="#006838" text-anchor="middle">12 FEV 2027</text>
    <text x="160" y="765" font-size="13" fill="#1a1a1a">facultativa</text>
    <text x="56" y="796" font-size="14" fill="#333">Se identificar, tem de ser um símbolo em</text>
    <text x="56" y="816" font-size="14" fill="#333">código QR ou outra tecnologia de marcação</text>
    <text x="56" y="836" font-size="14" fill="#333">digital. Um símbolo impresso estático,</text>
    <text x="56" y="856" font-size="14" fill="#333">sozinho, não basta.</text>
  </g>
</svg>
